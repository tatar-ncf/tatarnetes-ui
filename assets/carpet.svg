<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <!-- Татар келәме бизәге / tileable Tatar carpet ornament -->
  <rect width="220" height="220" fill="#0f5c34"/>
  <g stroke="#12693a" stroke-width="2" fill="none">
    <path d="M0 110 L110 0 L220 110 L110 220 Z"/>
    <path d="M110 0 L220 0 L220 110 M0 110 L0 220 L110 220 M110 0 L0 0 L0 110 M220 110 L220 220 L110 220"/>
  </g>
  <!-- Урта ромб / central diamond -->
  <g transform="translate(110,110)">
    <path d="M0 -46 L46 0 L0 46 L-46 0 Z" fill="#12693a" stroke="#e3a81a" stroke-width="2.5"/>
    <path d="M0 -30 L30 0 L0 30 L-30 0 Z" fill="#0f5c34" stroke="#d21f2a" stroke-width="2"/>
    <!-- лалә (тюльпан) / tulip -->
    <g fill="#e3a81a">
      <path d="M0 -18 C -8 -18 -10 -6 0 2 C 10 -6 8 -18 0 -18 Z"/>
      <circle cx="0" cy="10" r="3"/>
    </g>
  </g>
  <!-- Почмак розеткалары / corner rosettes -->
  <g fill="#d21f2a">
    <circle cx="0" cy="0" r="7"/><circle cx="220" cy="0" r="7"/>
    <circle cx="0" cy="220" r="7"/><circle cx="220" cy="220" r="7"/>
    <circle cx="0" cy="0" r="3" fill="#e3a81a"/><circle cx="220" cy="0" r="3" fill="#e3a81a"/>
    <circle cx="0" cy="220" r="3" fill="#e3a81a"/><circle cx="220" cy="220" r="3" fill="#e3a81a"/>
  </g>
  <!-- Кырый вак бизәк / small edge dots -->
  <g fill="#e3a81a">
    <circle cx="110" cy="8" r="3"/><circle cx="110" cy="212" r="3"/>
    <circle cx="8" cy="110" r="3"/><circle cx="212" cy="110" r="3"/>
  </g>
</svg>
