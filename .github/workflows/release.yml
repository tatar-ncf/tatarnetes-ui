name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: tar czf "tatarnetes-ui-${GITHUB_REF_NAME}.tar.gz" index.html style.css app.js lib.js config.js assets LICENSE NOTICE README.md
      - run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Татарнетес UI ${GITHUB_REF_NAME}" \
            --generate-notes \
            "tatarnetes-ui-${GITHUB_REF_NAME}.tar.gz"

  headlamp-plugin:
    # Плагинны релизга беркетә / attaches the Headlamp plugin to the release
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: headlamp-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build && npm run package
      - run: gh release upload "${GITHUB_REF_NAME}" ./*.tar.gz
